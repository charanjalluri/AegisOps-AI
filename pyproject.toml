[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegisops-ai"
version = "0.1.0"
description = "Evidence-driven AI incident intelligence and autonomous operations platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "AegisOps Team" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "aiokafka>=0.10.0",
    "asyncpg>=0.29.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.1",
    "langgraph>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
markers = [
    "integration: marks tests requiring running Docker infrastructure",
    "unit: marks fast offline unit tests",
]
